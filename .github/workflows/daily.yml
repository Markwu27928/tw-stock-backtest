name: 每日回測

on:
  schedule:
    - cron: "20 9 * * 1-5"      # 台北時間週一到週五 17:20（三大法人資料公布後）
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "抓資料時間上限（分鐘）。第一次回補歷史請填 330"
        default: "45"

permissions:
  contents: write

concurrency:
  group: daily-backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # 排隊等前一次跑完時，要拿到它剛存好的資料，避免重抓又推送衝突

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 模擬測試（沒通過就不更新資料與報告）
        run: python -m pytest -q tests

      - name: 抓資料、回測、產生報告
        run: python -m src.run_daily --max-minutes "${{ github.event.inputs.max_minutes || '45' }}"
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          FEE_DISCOUNT: ${{ vars.FEE_DISCOUNT || '1.0' }}

      - name: 存檔
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -q -m "每日更新 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase --autostash || true
          git push
